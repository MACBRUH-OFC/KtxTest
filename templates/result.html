<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Conversion Result</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
rel="stylesheet"
>

<style>

body{

font-family:'Inter',sans-serif;

background:
linear-gradient(
180deg,
#050816,
#0b1023
);

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

padding:25px;

color:white;
}

.card{

width:100%;

max-width:900px;

background:
rgba(255,255,255,0.05);

border:
1px solid rgba(255,255,255,0.08);

border-radius:32px;

padding:30px;

text-align:center;
}

h1{

font-size:42px;

margin-bottom:15px;
}

p{

color:#94a3b8;

margin-bottom:30px;
}

img{

width:100%;

border-radius:24px;

margin-bottom:25px;
}

.actions{

display:flex;

justify-content:center;

gap:15px;

flex-wrap:wrap;
}

a{

text-decoration:none;

padding:16px 24px;

border-radius:18px;

font-weight:700;

color:white;
}

.download{

background:
linear-gradient(
135deg,
#2563eb,
#7c3aed
);
}

.back{

background:
rgba(255,255,255,0.08);
}

</style>

</head>

<body>

<div class="card">

<h1>
Conversion Complete
</h1>

<p>
Your texture has been converted successfully.
</p>

<img src="{{ preview_url }}">

<div class="actions">

<a
class="download"
href="{{ download_url }}"
download
>

Download File

</a>

<a
class="back"
href="/"
>

Convert Another

</a>

</div>

</div>

</body>
</html>
