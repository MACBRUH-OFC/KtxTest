<!DOCTYPE html>
<html>

<head>

    <title>KTX Converter</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

        body{
            background:#0f0f0f;
            color:white;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .box{
            background:#1e1e1e;
            padding:25px;
            border-radius:15px;
            width:350px;
            box-shadow:0 0 20px rgba(0,0,0,0.5);
        }

        h1{
            text-align:center;
        }

        select,input,button{
            width:100%;
            margin-top:15px;
            padding:12px;
            border:none;
            border-radius:10px;
            font-size:16px;
        }

        input{
            background:#2a2a2a;
            color:white;
        }

        select{
            background:#2a2a2a;
            color:white;
        }

        button{
            background:#00aaff;
            color:white;
            font-weight:bold;
            cursor:pointer;
        }

        button:hover{
            opacity:0.9;
        }

    </style>

</head>

<body>

    <div class="box">

        <h1>KTX ↔ PNG</h1>

        <form method="POST" enctype="multipart/form-data">

            <select name="mode">

                <option value="ktx_to_png">
                    KTX → PNG
                </option>

                <option value="png_to_ktx">
                    PNG → KTX
                </option>

            </select>

            <input
                type="file"
                name="file"
                required
            >

            <button type="submit">
                Convert
            </button>

        </form>

    </div>

</body>

</html>
